plugins {
    id 'fabric-loom' version '1.6.12'
}

version = "26.1.1"
group = project.maven_group
// 使用惰性版本值，兼容 settings.gradle 的最终版本覆盖，后续版本复制项目后自动继承命名规则。
base {
    archivesName.set(providers.provider { "Crosssave-v${project.version}-mc1.20.1" })
}
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    // 版本已经包含在基本文件名中，禁止 Gradle 再追加一次版本。
    archiveVersion.set("")
}

loom {
    mixin {
        // 正式 JAR 改名时 Loom 默认会连带改变映射文件名，必须与 Mixin 配置中的固定名称保持一致。
        useLegacyMixinAp = true
        defaultRefmapName = "crosssave-refmap.json"
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 命令、客户端时钟和快捷键模块的版本均由固定的 Fabric API 版本确定。
    modImplementation fabricApi.module('fabric-command-api-v2', project.fabric_version)
    modImplementation fabricApi.module('fabric-lifecycle-events-v1', project.fabric_version)
    modImplementation fabricApi.module('fabric-key-binding-api-v1', project.fabric_version)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // 通过 Fabric 的测试启动器加载游戏类，使用加载器提供的正常访问修正。
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

processResources {
    inputs.property 'version', project.version
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test { useJUnitPlatform() }

tasks.named('wrapper') {
    gradleVersion = '8.7'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d'
}

// 开发环境和普通单元测试使用命名空间，不能发现正式 JAR 缺少映射；在构建中单独检查生产产物。
tasks.register('verifyProductionRefmap') {
    dependsOn tasks.named('remapJar')
    inputs.file(tasks.named('remapJar').flatMap { it.archiveFile })
    doLast {
        def artifact = tasks.named('remapJar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { archive ->
            def configEntry = archive.getEntry('crosssave.mixins.json')
            if (configEntry == null) throw new GradleException('正式 JAR 缺少 Mixin 配置')
            def config = archive.getInputStream(configEntry).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            def mapEntry = archive.getEntry(config.refmap as String)
            if (mapEntry == null) throw new GradleException('正式 JAR 缺少配置指定的映射文件：' + config.refmap)
            def refmap = archive.getInputStream(mapEntry).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            config.client.each { mixin ->
                def owner = config.package.replace('.', '/') + '/' + mixin
                if (!refmap.mappings[owner]) throw new GradleException('缺少生产 Mixin 映射：' + owner)
            }
            def setScreen = refmap.mappings['cn/crosssave/mixin/MinecraftClientMixin']['setScreen']
            if (setScreen == null || !setScreen.startsWith('Lnet/minecraft/class_310;method_')) {
                throw new GradleException('setScreen 尚未映射到 1.20.1 正式环境')
            }
            if (refmap.data['named:intermediary'] != refmap.mappings) {
                throw new GradleException('正式环境映射上下文不一致')
            }
            logger.lifecycle('正式 JAR 的 Mixin 映射验证通过：' + config.refmap)
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyProductionRefmap') }
